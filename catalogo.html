// 🔧 NORMALIZA TEXTO (remove acento, minúsculo)
function normalizar(texto) {
  return texto
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "");
}

// 🔧 CONVERTE CSV PRA ARRAY
let dados = csv
  .replace(/"/g, "")
  .replace(/\r/g, "")
  .split(/[\n;,]+/)
  .map(l => l.trim())
  .filter(l => l !== "")
  .map(l => ({
    nome: l,
    busca: normalizar(l)
  }));

// 🔧 MOSTRAR RESULTADOS
function mostrarResultados(lista, termo = "") {
  const div = document.getElementById("resultados");
  div.innerHTML = "";

  if (lista.length === 0) {
    div.innerHTML = '<div class="vazio">Nenhum resultado encontrado</div>';
    return;
  }

  lista.forEach(item => {
    const el = document.createElement("div");
    el.className = "resultado";

    if (termo) {
      const regex = new RegExp(`(${termo})`, "gi");
      el.innerHTML = item.nome.replace(regex, "<b>$1</b>");
    } else {
      el.textContent = item.nome;
    }

    div.appendChild(el);
  });
}

// 🔥 MOSTRA TODOS AO ABRIR (limitado)
mostrarResultados(dados.slice(0, 6000));

// 🔎 BUSCA
document.getElementById("busca").addEventListener("input", function() {
  const termoOriginal = this.value.trim();
  const termo = normalizar(termoOriginal);

  if (!termo) {
    mostrarResultados(dados.slice(0, 6000));
    return;
  }

  const filtrados = dados.filter(item =>
    item.busca.includes(termo)
  );

  mostrarResultados(filtrados.slice(0, 200), termoOriginal);
});

</script>
